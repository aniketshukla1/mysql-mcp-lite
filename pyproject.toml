[project]
name = "mysql-mcp-lite"
version = "0.1.0"
description = "MCP server for MySQL: browse schemas and run read-only SQL from any MCP client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "pymysql>=1.1"]  # keep in sync with the script header in mysql_mcp_lite.py

[project.scripts]
mysql-mcp-lite = "mysql_mcp_lite:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mysql_mcp_lite.py"]
